server:
  port: 0

spring:
  application:
    name: airwise-test
  datasource:
    # Completely isolated in-memory database for automated tests
    url: jdbc:h2:mem:airwise_testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driverClassName: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

airwise:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000
  data-sync:
    enabled: false # Disable scheduled sync during testing
    interval-ms: 3600000

